name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: moba
          POSTGRES_PASSWORD: moba_secret
          POSTGRES_DB: moba_db
        ports:
          - 6432:5432
        options: >-
          --health-cmd "pg_isready -U moba -d moba_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 7379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run generate -w shared && git diff --exit-code -- shared/generated/protocol.js
      - run: cp server/.env.example server/.env
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run build
      - run: npm run test:server
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  image:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build-and-e2e
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: registry
        name: Normalize image owner
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.registry.outputs.owner }}/ninjas-x:sha-${{ github.sha }}
            ghcr.io/${{ steps.registry.outputs.owner }}/ninjas-x:latest
          cache-from: type=gha,scope=ninjas-x
          cache-to: type=gha,mode=max,scope=ninjas-x

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: read
    environment: production
    concurrency:
      group: ninjas-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -eu
          test -n "$VM_KNOWN_HOSTS"
          test -n "$VM_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null
      - name: Upload configuration
        env:
          VM_HOST: ${{ secrets.VM_HOST || '176.123.163.174' }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -eu
          for required in VM_USER; do
            if [ -z "${!required}" ]; then
              echo "::error::Missing deploy secret: $required"
              exit 1
            fi
          done
          port="${VM_PORT:-22}"
          remote_dir="/tmp/ninjas-deploy-${GITHUB_RUN_ID}"
          ssh -i ~/.ssh/id_deploy -p "$port" "$VM_USER@$VM_HOST" "mkdir -p '$remote_dir'"
          scp -i ~/.ssh/id_deploy -P "$port" compose.prod.yml ops/nginx-site.conf ops/bootstrap-host.sh ops/deploy.sh ops/init-env.sh "$VM_USER@$VM_HOST:$remote_dir/"
          ssh -i ~/.ssh/id_deploy -p "$port" "$VM_USER@$VM_HOST" "sudo install -d -m 750 /opt/ninjas-x && sudo chown '$VM_USER' /opt/ninjas-x && cp '$remote_dir/'* /opt/ninjas-x/ && chmod 750 /opt/ninjas-x/bootstrap-host.sh /opt/ninjas-x/deploy.sh /opt/ninjas-x/init-env.sh && rm -rf '$remote_dir' && /opt/ninjas-x/init-env.sh"
      - name: Set up HTTPS routing
        env:
          VM_HOST: ${{ secrets.VM_HOST || '176.123.163.174' }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          port="${VM_PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$port" "$VM_USER@$VM_HOST" "sudo /opt/ninjas-x/bootstrap-host.sh"
      - name: Deploy and verify
        env:
          VM_HOST: ${{ secrets.VM_HOST || '176.123.163.174' }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPOSITORY: ${{ github.repository_owner }}/ninjas-x
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -eu
          port="${VM_PORT:-22}"
          docker_config="/tmp/ninjas-ghcr-${GITHUB_RUN_ID}"
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy -p "$port" "$VM_USER@$VM_HOST" "mkdir -p '$docker_config' && DOCKER_CONFIG='$docker_config' docker login ghcr.io --username '${GITHUB_ACTOR}' --password-stdin"
          ssh -i ~/.ssh/id_deploy -p "$port" "$VM_USER@$VM_HOST" "cd /opt/ninjas-x && IMAGE_REPOSITORY='${IMAGE_REPOSITORY,,}' IMAGE_TAG='$IMAGE_TAG' DOCKER_CONFIG='$docker_config' ./deploy.sh; result=\$?; rm -rf '$docker_config'; exit \$result"

syntax = "proto3";

package moba;

message Input {
  uint32 seq = 1;
  sint32 dx = 2;
  sint32 dy = 3;
  bool attack = 4;
  string cast = 5;
  uint32 target_unit = 6;
  sint32 aim_x = 7;
  sint32 aim_y = 8;
  bool aimed = 9;
}

message Effect {
  uint32 id = 1;
  uint32 caster = 2;
  string kind = 3;
  sint32 x = 4;
  sint32 y = 5;
  uint32 target = 6;
  uint32 tick = 7;
  uint32 source_unit = 8;
  uint32 amount = 9;
}

message Unit {
  uint32 id = 1;
  uint32 kind = 2;
  uint32 team = 3;
  uint32 lane = 4;
  sint32 x = 5;
  sint32 y = 6;
  uint32 hp = 7;
  uint32 max_hp = 8;
}

message PlayerState {
  uint32 index = 1;
  sint32 x = 2;
  sint32 y = 3;
  uint32 hp = 4;
  uint32 max_hp = 5;
  uint32 mana = 6;
  uint32 max_mana = 7;
  uint32 speed = 8;
  uint32 kills = 9;
  uint32 deaths = 10;
  uint32 last_processed_seq = 11;
  string hero_id = 12;
  uint32 gold = 13;
  uint32 gold_earned = 14;
  uint32 last_hits = 15;
  uint32 assists = 16;
  repeated InventorySlot inventory = 17;
  repeated uint32 ability_ready_ticks = 18;
}

message InventorySlot {
  uint32 item_index = 1;
  uint32 ready_tick = 2;
}

message Snapshot {
  uint32 tick = 1;
  uint32 status = 2;
  uint32 winner_team = 3;
  repeated PlayerState players = 4;
  repeated Effect effects = 5;
  repeated Unit units = 6;
}
